name: Publish Beprofitable 1.0.4 Beta

on:
  push:
    branches:
      - main
    paths:
      - "release/v1.0.4-beta/**"
      - ".github/workflows/publish-1.0.4-beta.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.4-beta
          name: Beprofitable Beta 1.0.4
          body: |
            Beprofitable Beta 1.0.4

            - Session and check-in settings can now be edited any day, not only Sunday.
            - Settings text now clearly says Session, Check-in, and Loss Protocol remain editable any day.
            - This update does not reset or delete user data.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release/v1.0.4-beta/Beprofitable-Beta-Setup-1.0.4-beta.exe
            release/v1.0.4-beta/Beprofitable-Beta-Setup-1.0.4-beta.exe.blockmap
            release/v1.0.4-beta/latest.yml

      - name: Ensure installer asset is uploaded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.0.4-beta release/v1.0.4-beta/Beprofitable-Beta-Setup-1.0.4-beta.exe --clobber
