name: Publish Beprofitable 1.0.10 Beta

on:
  push:
    branches:
      - main
    paths:
      - "release/v1.0.10-beta/**"
      - ".github/workflows/publish-1.0.10-beta.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.10-beta
          name: Beprofitable Beta 1.0.10
          body: |
            Beprofitable Beta 1.0.10

            - Fixed Trading Panel vertical alignment after uniform scaling.
            - The scaled protocol now uses a real scaled frame, so the top is no longer cut off and the bottom margin is not oversized.
            - No calculator, confluence, habit, journal, or user-data behavior was reset.
            - This update does not reset or delete user data.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release/v1.0.10-beta/Beprofitable-Beta-Setup-1.0.10-beta.exe
            release/v1.0.10-beta/Beprofitable-Beta-Setup-1.0.10-beta.exe.blockmap
            release/v1.0.10-beta/latest.yml

      - name: Ensure installer asset is uploaded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.0.10-beta release/v1.0.10-beta/Beprofitable-Beta-Setup-1.0.10-beta.exe --clobber
