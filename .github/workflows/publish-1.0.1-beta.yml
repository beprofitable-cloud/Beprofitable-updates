name: Publish Beprofitable 1.0.1 Beta

on:
  push:
    branches:
      - main
    paths:
      - "release/v1.0.1-beta/**"
      - ".github/workflows/publish-1.0.1-beta.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1-beta
          name: Beprofitable Beta 1.0.1
          body: |
            Beprofitable Beta update 1.0.1.

            Includes the update popout behavior, Settings updates page, clean profile updates removal, calendar fixes, and latest beta polish.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release/v1.0.1-beta/Beprofitable-Beta-Setup-1.0.1-beta.exe
            release/v1.0.1-beta/Beprofitable-Beta-Setup-1.0.1-beta.exe.blockmap
            release/v1.0.1-beta/latest.yml
