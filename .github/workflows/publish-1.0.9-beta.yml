name: Publish Beprofitable 1.0.9 Beta

on:
  push:
    branches:
      - main
    paths:
      - "release/v1.0.9-beta/**"
      - ".github/workflows/publish-1.0.9-beta.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.9-beta
          name: Beprofitable Beta 1.0.9
          body: |
            Beprofitable Beta 1.0.9

            - Trading Session now uses a uniform 1672x941 stage scale so the full protocol keeps the same proportions across larger monitors.
            - Habit Tracker now uses a centered uniform 1680x941 stage scale so it no longer stays fixed in a corner on large displays.
            - The pre-trade calculator no longer lets the Contracts area absorb all extra height; checklist, market, and stop loss get better spacing.
            - This update does not reset or delete user data.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release/v1.0.9-beta/Beprofitable-Beta-Setup-1.0.9-beta.exe
            release/v1.0.9-beta/Beprofitable-Beta-Setup-1.0.9-beta.exe.blockmap
            release/v1.0.9-beta/latest.yml

      - name: Ensure installer asset is uploaded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.0.9-beta release/v1.0.9-beta/Beprofitable-Beta-Setup-1.0.9-beta.exe --clobber
