name: Publish Beprofitable 1.0.6 Beta

on:
  push:
    branches:
      - main
    paths:
      - "release/v1.0.6-beta/**"
      - ".github/workflows/publish-1.0.6-beta.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.6-beta
          name: Beprofitable Beta 1.0.6
          body: |
            Beprofitable Beta 1.0.6

            - Removed production access to all test mode/demo data.
            - Refined the Trade Control Panel layout, calculator scaling, and confluence alignment.
            - Kept the update flow compatible with existing user data.
            - No test panel, demo account, demo habits, or demo trading links are included.
            - This update does not reset or delete user data.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release/v1.0.6-beta/Beprofitable-Beta-Setup-1.0.6-beta.exe
            release/v1.0.6-beta/Beprofitable-Beta-Setup-1.0.6-beta.exe.blockmap
            release/v1.0.6-beta/latest.yml

      - name: Ensure installer asset is uploaded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.0.6-beta release/v1.0.6-beta/Beprofitable-Beta-Setup-1.0.6-beta.exe --clobber

